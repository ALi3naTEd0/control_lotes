name: Update docs version

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Determine asset names
        id: assets
        env:
          ASSETS_JSON: ${{ toJson(github.event.release.assets) }}
        run: |
          WIN_ASSET=$(echo "$ASSETS_JSON" | jq -r '[.[] | select(.name == "control_lotes_setup.exe")][0].name // empty')
          if [ -z "$WIN_ASSET" ]; then
            WIN_ASSET=$(echo "$ASSETS_JSON" | jq -r '[.[] | select(.name == "control_lotes.exe")][0].name // empty')
          fi
          APK_ASSET=$(echo "$ASSETS_JSON" | jq -r '[.[] | select(.name == "control_lotes.apk")][0].name // empty')
          echo "win_asset=$WIN_ASSET" >> "$GITHUB_OUTPUT"
          echo "apk_asset=$APK_ASSET" >> "$GITHUB_OUTPUT"

      - name: Update docs/index.html
        env:
          TAG: ${{ github.event.release.tag_name }}
          WIN_ASSET: ${{ steps.assets.outputs.win_asset }}
          APK_ASSET: ${{ steps.assets.outputs.apk_asset }}
        run: |
          set -e
          if [ -z "$WIN_ASSET" ] && [ -z "$APK_ASSET" ]; then
            echo "El release '$TAG' no tiene assets de Windows/Android reconocidos; no se toca docs/"
            exit 0
          fi
          if [ -n "$WIN_ASSET" ]; then
            sed -i -E "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/control_lotes(_setup)?\.exe#releases/download/${TAG}/${WIN_ASSET}#" docs/index.html
          fi
          if [ -n "$APK_ASSET" ]; then
            sed -i -E "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/control_lotes\.apk#releases/download/${TAG}/${APK_ASSET}#" docs/index.html
          fi
          sed -i -E "s#(<span class=\"version\">)v[0-9]+\.[0-9]+\.[0-9]+(</span>)#\1${TAG}\2#" docs/index.html

      - name: Commit and push if changed
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Sin cambios en docs/index.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "docs: actualizar versión a ${TAG}"
          git push origin HEAD:main
