name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión (ej: 1.0.0)'
        required: true
        type: string
        default: '1.0.8'
      platforms:
        description: 'Plataformas a construir'
        required: true
        type: choice
        options:
          - all
          - android
          - windows
        default: 'all'

permissions:
  contents: write

jobs:
  build-exe:
    if: inputs.platforms == 'all' || inputs.platforms == 'windows'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          flet pack lotes_flet.py --name control_lotes --icon assets/icon.ico --add-data "assets;assets"

      - name: Ensure Inno Setup is installed
        shell: powershell
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer with Inno Setup
        shell: powershell
        run: ISCC.exe installer.iss /DMyAppVersion=${{ inputs.version }}

      - name: Stage Windows artifacts
        # actions/upload-artifact con varias rutas conserva las carpetas de
        # origen (dist/, installer_output/) dentro del artifact; el download
        # posterior con merge-multiple espera los archivos sueltos en la raíz
        # (./release/control_lotes*.exe), así que se copian a un directorio
        # plano antes de subir.
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_dist | Out-Null
          Copy-Item dist\control_lotes.exe release_dist\control_lotes.exe
          Copy-Item installer_output\control_lotes_setup.exe release_dist\control_lotes_setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: control_lotes-windows
          path: release_dist/*

  build-apk:
    if: inputs.platforms == 'all' || inputs.platforms == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Compute versionCode
        id: vcode
        run: echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Decode Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-release.jks

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flet build apk \
            --yes \
            --module-name lotes_flet \
            --project "control_lotes" \
            --org "com.controllotes" \
            --product "Control de Lotes" \
            --description "Control y seguimiento de lotes de plantas" \
            --build-version "${{ inputs.version }}" \
            --build-number ${{ steps.vcode.outputs.code }} \
            --android-signing-key-store "$(pwd)/android-release.jks" \
            --android-signing-key-store-password "$ANDROID_KEYSTORE_PASSWORD" \
            --android-signing-key-password "$ANDROID_KEY_PASSWORD" \
            --android-signing-key-alias "$ANDROID_KEY_ALIAS" \
            --verbose

      - name: Remove keystore from runner
        if: always()
        run: rm -f android-release.jks

      - name: Rename APK
        run: |
          APK_FILE=$(find build/apk -name "*.apk" -type f | head -1)
          if [ -n "$APK_FILE" ] && [ "$APK_FILE" != "build/apk/control_lotes.apk" ]; then
            mv "$APK_FILE" build/apk/control_lotes.apk
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: control_lotes-android
          path: build/apk/control_lotes.apk
          if-no-files-found: warn

  create-release:
    needs: [build-exe, build-apk]
    if: always() && (needs.build-exe.result == 'success' || needs.build-apk.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release
          merge-multiple: true

      - name: List files
        run: ls -la ./release/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: Control de Lotes v${{ inputs.version }}
          draft: false
          files: |
            ./release/control_lotes.exe
            ./release/control_lotes_setup.exe
            ./release/control_lotes.apk
          fail_on_unmatched_files: false
          body: |
            ## 📦 Control de Lotes v${{ inputs.version }}
            
            ### 💻 Windows
            - `control_lotes_setup.exe`: instalador (recomendado), crea accesos directos en el menú inicio/escritorio.
            - `control_lotes.exe`: versión portable, sin instalación.
            
            ### 📱 Android
            1. Descarga `control_lotes.apk`
            2. Habilita "Instalar desde fuentes desconocidas"
            3. Instala el APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-docs:
    needs: [build-exe, build-apk, create-release]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Update docs/index.html
        env:
          TAG: v${{ inputs.version }}
          WIN_OK: ${{ needs.build-exe.result == 'success' }}
          APK_OK: ${{ needs.build-apk.result == 'success' }}
        run: |
          set -e
          if [ "$WIN_OK" = "true" ]; then
            sed -i -E "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/control_lotes(_setup)?\.exe#releases/download/${TAG}/control_lotes_setup.exe#" docs/index.html
          fi
          if [ "$APK_OK" = "true" ]; then
            sed -i -E "s#releases/download/v[0-9]+\.[0-9]+\.[0-9]+/control_lotes\.apk#releases/download/${TAG}/control_lotes.apk#" docs/index.html
          fi
          sed -i -E "s#(<span class=\"version\">)v[0-9]+\.[0-9]+\.[0-9]+(</span>)#\1${TAG}\2#" docs/index.html

      - name: Commit and push if changed
        env:
          TAG: v${{ inputs.version }}
        run: |
          if git diff --quiet -- docs/index.html; then
            echo "Sin cambios en docs/index.html"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "docs: actualizar versión a ${TAG}"
          git push origin HEAD:main
