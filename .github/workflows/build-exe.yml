
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Check icon exists
        shell: powershell
        run: |
          if (!(Test-Path -Path 'assets/icon.ico')) {
            Write-Error 'Error: assets/icon.ico not found. Add the file at assets/icon.ico and re-run the workflow.'
            exit 1
          }

      - name: Build EXE with Flet
        run: |
          flet pack lotes_flet.py --name control_lotes --icon assets/icon.ico --add-data "assets;assets"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7
        with:
          name: control_lotes-exe
          path: dist/control_lotes.exe

      - name: Ensure Inno Setup is installed
        shell: powershell
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer with Inno Setup
        shell: powershell
        run: |
          $version = (Select-String -Path lotes_flet.py -Pattern "VERSION = '([^']+)'").Matches[0].Groups[1].Value
          ISCC.exe installer.iss /DMyAppVersion=$version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: control_lotes-installer
          path: installer_output/control_lotes_setup.exe
